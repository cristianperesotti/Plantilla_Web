<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Gastronómico - Gourmet Elite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1a1a2e;
      --secondary: #16213e;
      --accent: #e94560;
      --gold: #ffd700;
      --text-light: #ffffff;
      --text-dark: #2c2c2c;
      --background: #f8f9fa;
      --card-shadow: 0 8px 32px rgba(0,0,0,0.12);
      --card-shadow-hover: 0 16px 48px rgba(0,0,0,0.18);
      --gradient: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ffb347 100%);
    }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; 
      background: var(--background); 
      color: var(--text-dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Header con animación de fade-in */
    header {
      position: relative;
      height: 60vh;
      background: var(--gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: slideDown 1s ease-out;
    }

    @keyframes slideDown {
      from { transform: translateY(-100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('https://images.unsplash.com/photo-1414235077428-338989a2e8c0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=2070&q=80') center/cover;
      opacity: 0.3;
      animation: zoomIn 1.5s ease-out;
    }

    @keyframes zoomIn {
      from { transform: scale(1.1); }
      to { transform: scale(1); }
    }

    .hero-content {
      text-align: center;
      color: var(--text-light);
      z-index: 2;
      animation: fadeInUp 1s 0.5s both;
    }

    @keyframes fadeInUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-content p {
      font-size: 1.2rem;
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Título de sección */
    .section-title {
      text-align: center;
      margin: 4rem 0 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--primary);
      position: relative;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-title::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--gold-gradient);
      border-radius: 2px;
    }

    /* Filtros mejorados */
    .category-filters { 
      display: flex; 
      flex-wrap: wrap; 
      justify-content: center; 
      gap: 15px; 
      margin: 2rem 1rem; 
      animation: slideUp 0.8s 0.3s both;
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .category-filters button { 
      padding: 12px 24px;
      border: 2px solid var(--primary);
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--primary);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .category-filters button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: var(--gradient);
      transition: left 0.4s ease;
      z-index: -1;
    }

    .category-filters button:hover::before,
    .category-filters button.active::before {
      left: 0;
    }

    .category-filters button:hover,
    .category-filters button.active { 
      color: var(--text-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(26, 26, 46, 0.3);
    }

    /* Grid de productos mejorado */
    .container { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
      gap: 2rem; 
      padding: 2rem; 
      max-width: 1400px;
      margin: 0 auto;
    }

    .product { 
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      position: relative;
      animation: scaleIn 0.6s ease-out both;
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .product:nth-child(1) { animation-delay: 0.1s; }
    .product:nth-child(2) { animation-delay: 0.2s; }
    .product:nth-child(3) { animation-delay: 0.3s; }
    .product:nth-child(4) { animation-delay: 0.4s; }
    .product:nth-child(5) { animation-delay: 0.5s; }
    .product:nth-child(6) { animation-delay: 0.6s; }

    .product:hover { 
      transform: translateY(-15px) scale(1.02);
      box-shadow: var(--card-shadow-hover);
    }

    .product::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gold-gradient);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .product:hover::before {
      transform: scaleX(1);
    }

    .product-image {
      position: relative;
      overflow: hidden;
      height: 250px;
    }

    .product img { 
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product:hover img {
      transform: scale(1.1);
    }

    .product-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(26, 26, 46, 0.8), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product:hover .product-overlay {
      opacity: 1;
    }

    .view-details {
      background: var(--gold-gradient);
      color: var(--text-dark);
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      transform: translateY(20px);
      transition: transform 0.3s 0.1s ease;
    }

    .product:hover .view-details {
      transform: translateY(0);
    }

    .product-info { 
      padding: 1.5rem;
    }

    .product h3 { 
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .product p { 
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--accent);
      margin: 0;
    }

    /* Carrito flotante mejorado */
    .cart-float { 
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--gradient);
      color: var(--text-light);
      padding: 15px 25px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.1rem;
      box-shadow: var(--card-shadow);
      cursor: pointer;
      z-index: 1000;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: bounceIn 1s ease-out;
    }

    @keyframes bounceIn {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .cart-float:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: var(--card-shadow-hover);
    }

    .cart-float::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: var(--gold-gradient);
      border-radius: 50px;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .cart-float:hover::before {
      opacity: 1;
    }

    /* Modales mejorados */
    .modal { 
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(26, 26, 46, 0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content { 
      background: white;
      padding: 2rem;
      border-radius: 20px;
      width: 90%;
      max-width: 600px;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: var(--card-shadow-hover);
      animation: modalSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalSlideIn {
      from { transform: scale(0.9) translateY(30px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-content h2 { 
      font-family: 'Playfair Display', serif;
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--primary);
      font-size: 2rem;
    }

    .close-modal { 
      position: absolute;
      top: 1rem;
      right: 1rem;
      border: none;
      background: var(--accent);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .close-modal:hover {
      background: #d63447;
      transform: rotate(90deg);
    }

    /* Botones mejorados */
    .whatsapp-button, .add-cart, .clear-cart-button { 
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
    }

    .whatsapp-button {
      background: #25D366;
      color: white;
      margin-top: 1.5rem;
    }

    .whatsapp-button:hover { 
      background: #1da851;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
    }

    .add-cart {
      background: var(--gradient);
      color: white;
    }

    .add-cart:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(26, 26, 46, 0.4);
    }

    .clear-cart-button {
      background: var(--accent);
      color: white;
      margin-top: 1rem;
    }

    .clear-cart-button:hover {
      background: #d63447;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
    }

    /* Detalles del producto en modal */
    #productDetailModal img.main-image { 
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 1rem;
      transition: transform 0.3s ease;
    }

    #productDetailModal img.main-image:hover {
      transform: scale(1.02);
    }

    .thumbnail-gallery { 
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .thumbnail-gallery img { 
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .thumbnail-gallery img:hover {
      transform: scale(1.1);
      border-color: var(--gold);
    }

    .thumbnail-gallery img.selected { 
      border-color: var(--primary);
      transform: scale(1.1);
    }

    #productDetailModal p { 
      margin: 1rem 0;
      text-align: justify;
      line-height: 1.7;
      color: #666;
    }

    /* Items del carrito mejorados */
    .cart-item { 
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 12px;
      transition: all 0.3s ease;
      border-left: 4px solid var(--gold);
    }

    .cart-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .cart-item-info { 
      flex: 1;
      font-weight: 500;
    }

    .cart-item-controls { 
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cart-item-controls button { 
      padding: 6px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      min-width: 32px;
    }

    .btn-minus { 
      background: #ffc107;
      color: black;
    }

    .btn-minus:hover {
      background: #ffb300;
      transform: scale(1.1);
    }

    .btn-plus { 
      background: #28a745;
      color: white;
    }

    .btn-plus:hover {
      background: #218838;
      transform: scale(1.1);
    }

    .btn-remove { 
      background: var(--accent);
      color: white;
    }

    .btn-remove:hover {
      background: #d63447;
      transform: scale(1.1);
    }

    /* Formulario de entrega */
    .delivery-options {
      margin: 1.5rem 0;
      padding: 1.5rem;
      background: #f8f9fa;
      border-radius: 12px;
    }

    .delivery-options h3 {
      font-family: 'Playfair Display', serif;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .delivery-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .delivery-options label:hover {
      color: var(--accent);
    }

    #addressField input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      margin-top: 10px;
    }

    #addressField input:focus {
      border-color: var(--primary);
      outline: none;
    }

    /* Responsive mejorado */
    @media (max-width: 768px) {
      .hero-content h1 {
        font-size: 2.5rem;
      }
      
      .hero-content p {
        font-size: 1rem;
        padding: 0 1rem;
      }
      
      .container {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      
      .cart-float {
        bottom: 1rem;
        right: 1rem;
        padding: 12px 20px;
        font-size: 1rem;
      }
      
      .modal-content {
        margin: 1rem;
        width: calc(100% - 2rem);
      }
    }

    /* Animaciones adicionales */
    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    
    @keyframes slideOutRight {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* Scrollbar personalizado */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--gradient);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    /* Loading state */
    .loading {
      opacity: 0.5;
      pointer-events: none;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

<header>
  <div class="hero-content">
    <h1>Gourmet Elite</h1>
    <p>Experiencia culinaria excepcional con los mejores sabores artesanales</p>
  </div>
</header>

<section id="productos">
  <h2 class="section-title">Nuestro Menú</h2>

  <!-- Filtros -->
  <div class="category-filters">
    <button class="active" onclick="filterProducts('all', this)">Todos</button>
    <button onclick="filterProducts('pizzas', this)">Pizzas</button>
    <button onclick="filterProducts('empanadas', this)">Empanadas</button>
    <button onclick="filterProducts('hamburguesas', this)">Hamburguesas</button>
    <button onclick="filterProducts('bebidas', this)">Bebidas</button>
    <button onclick="filterProducts('postres', this)">Postres</button>
  </div>

  <!-- Productos -->
  <main class="container" id="productList"></main>
</section>

<div class="cart-float" onclick="toggleCart()">🛒 $<span id="cartTotal">0</span></div>

<!-- Modal Carrito -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <button class="close-modal" onclick="toggleCart()">✖</button>
    <h2>Tu Pedido</h2>
    <div id="cartItems"></div>
    <p style="text-align: center; font-size: 1.3em; font-weight: 600; color: var(--primary); margin: 1.5rem 0;"><strong>Total: $<span id="modalTotal">0</span></strong></p>

    <div class="delivery-options">
      <h3>Opciones de Entrega</h3>
      <label><input type="radio" name="deliveryOption" value="retiro" checked onchange="toggleAddress()"> 🏪 Retiro por local</label>
      <label><input type="radio" name="deliveryOption" value="envio" onchange="toggleAddress()"> 🚚 Envío a domicilio</label>
      <div id="addressField" style="display:none;">
        <input type="text" id="deliveryAddress" placeholder="Ingresa tu dirección completa">
      </div>
    </div>

    <button class="clear-cart-button" onclick="clearCart()">🗑️ Vaciar carrito</button>
    <button class="whatsapp-button" onclick="sendWhatsApp()">📱 Confirmar pedido</button>
  </div>
</div>

<!-- Modal Detalle de Producto -->
<div class="modal" id="productDetailModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeProductDetail()">✖</button>
    <img id="detailImage" class="main-image" src="" alt="">
    <div class="thumbnail-gallery" id="thumbnailGallery"></div>
    <h2 id="detailName"></h2>
    <p style="color: var(--accent); font-size: 1.4rem; font-weight: 700; text-align: center;">$<span id="detailPrice"></span></p>
    <p id="detailDescription"></p>
    <button class="add-cart" id="addToCartDetailButton">🛒 Agregar al carrito</button>
  </div>
</div>

<script>
  // Productos de ejemplo gourmet mejorados 🍕🍔🥤🍮
  const products = [
    { id: 1, name: "Pizza Margherita Artesanal", price: 5500, category: "pizzas",
      images: ["https://images.unsplash.com/photo-1604382354936-07c5d9983bd3?w=400&h=300&fit=crop",
               "https://images.unsplash.com/photo-1571997478779-2adcbbe9ab2f?w=400&h=300&fit=crop"],
      description: "Pizza artesanal con salsa de tomate casera, mozzarella di bufala, albahaca fresca y aceite de oliva extra virgen. Masa madre fermentada por 48 horas."
    },
    { id: 2, name: "Pizza Quattro Formaggi", price: 6200, category: "pizzas",
      images: ["https://images.unsplash.com/photo-1593560708920-61dd98c46a4e?w=400&h=300&fit=crop"],
      description: "Exquisita combinación de cuatro quesos: mozzarella, gorgonzola, parmesano y provolone, sobre base de crema y hierbas aromáticas."
    },
    { id: 5, name: "Burger Gourmet Clásica", price: 5200, category: "hamburguesas",
      images: ["https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400&h=300&fit=crop"],
      description: "Medallón de carne Aberdeen Angus 200g, queso cheddar maduro, lechuga fresca, tomate, cebolla morada y salsa especial. Incluye papas rústicas."
    },
    { id: 7, name: "Coca Cola 500ml", price: 1200, category: "bebidas",
      images: ["https://images.unsplash.com/photo-1581636625402-29b2a704ef13?w=400&h=300&fit=crop"],
      description: "Refrescante Coca Cola original en botella de vidrio de 500ml, servida bien fría."
    },
    { id: 9, name: "Tiramisu Artesanal", price: 2800, category: "postres",
      images: ["https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=400&h=300&fit=crop"],
      description: "Clásico tiramisú italiano con café espresso, mascarpone cremoso, cacao amargo y un toque de licor. Preparado con receta tradicional."
    },
  ];

  let cart = [];
  let selectedCategory = 'all';

  // Renderizar productos
  function renderProducts() {
    const container = document.getElementById('productList');
    container.innerHTML = '';
    let filteredProducts = selectedCategory === 'all' ? products : products.filter(p => p.category === selectedCategory);
    
    filteredProducts.forEach(product => {
      const productCard = document.createElement('div');
      productCard.className = 'product';
      productCard.innerHTML = `
        <div class="product-image" onclick="openProductDetail(${product.id})">
          <img src="${product.images[0]}" alt="${product.name}">
          <div class="product-overlay"><span class="view-details">Ver Detalle</span></div>
        </div>
        <div class="product-info">
          <h3>${product.name}</h3>
          <p>$${product.price}</p>
        </div>
      `;
      container.appendChild(productCard);
    });
  }

  // Filtrar productos
  function filterProducts(category, button) {
    selectedCategory = category;
    document.querySelectorAll('.category-filters button').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');
    renderProducts();
  }

  // Carrito
  function toggleCart() {
    const modal = document.getElementById('cartModal');
    modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    renderCart();
  }

  function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    const existing = cart.find(item => item.id === productId);
    if (existing) {
      existing.quantity++;
    } else {
      cart.push({...product, quantity: 1});
    }
    updateCartTotal();
  }

  function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    renderCart();
    updateCartTotal();
  }

  function changeQuantity(productId, delta) {
    const item = cart.find(i => i.id === productId);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) removeFromCart(productId);
    renderCart();
    updateCartTotal();
  }

  function clearCart() {
    cart = [];
    renderCart();
    updateCartTotal();
  }

  function updateCartTotal() {
    const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    document.getElementById('cartTotal').innerText = total;
    document.getElementById('modalTotal').innerText = total;
  }

  function renderCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = '';
    cart.forEach(item => {
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <div class="cart-item-info">
          ${item.name} <br> $${item.price} x ${item.quantity}
        </div>
        <div class="cart-item-controls">
          <button class="btn-minus" onclick="changeQuantity(${item.id}, -1)">-</button>
          <button class="btn-plus" onclick="changeQuantity(${item.id}, 1)">+</button>
          <button class="btn-remove" onclick="removeFromCart(${item.id})">x</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // Modal de producto
  let currentDetailProductId = null;
  function openProductDetail(productId) {
    currentDetailProductId = productId;
    const product = products.find(p => p.id === productId);
    document.getElementById('detailImage').src = product.images[0];
    document.getElementById('detailName').innerText = product.name;
    document.getElementById('detailPrice').innerText = product.price;
    document.getElementById('detailDescription').innerText = product.description;

    // Miniaturas
    const gallery = document.getElementById('thumbnailGallery');
    gallery.innerHTML = '';
    product.images.forEach((img, index) => {
      const thumb = document.createElement('img');
      thumb.src = img;
      thumb.className = index === 0 ? 'selected' : '';
      thumb.onclick = () => {
        document.getElementById('detailImage').src = img;
        gallery.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
        thumb.classList.add('selected');
      };
      gallery.appendChild(thumb);
    });

    document.getElementById('productDetailModal').style.display = 'flex';
  }

  function closeProductDetail() {
    document.getElementById('productDetailModal').style.display = 'none';
  }

  document.getElementById('addToCartDetailButton').addEventListener('click', () => {
    if (currentDetailProductId) addToCart(currentDetailProductId);
    closeProductDetail();
  });

  // Opciones de entrega
  function toggleAddress() {
    const deliveryOption = document.querySelector('input[name="deliveryOption"]:checked').value;
    document.getElementById('addressField').style.display = deliveryOption === 'envio' ? 'block' : 'none';
  }

  // WhatsApp
  function sendWhatsApp() {
    if (cart.length === 0) {
      alert('Tu carrito está vacío.');
      return;
    }

    const deliveryOption = document.querySelector('input[name="deliveryOption"]:checked').value;
    let addressText = '';
    if (deliveryOption === 'envio') {
      const address = document.getElementById('deliveryAddress').value.trim();
      if (!address) {
        alert('Ingresa tu dirección de entrega.');
        return;
      }
      addressText = `\nDirección: ${address}`;
    }

    let message = 'Hola! Quiero hacer el siguiente pedido:\n\n';
    cart.forEach(item => {
      message += `${item.quantity} x ${item.name} - $${item.price * item.quantity}\n`;
    });
    message += `\nTotal: $${cart.reduce((sum, i) => sum + i.price * i.quantity, 0)}`;
    message += `\nOpción: ${deliveryOption === 'retiro' ? 'Retiro por local' : 'Envío a domicilio'}${addressText}`;

    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me/5491123456789?text=${encodedMessage}`, '_blank');
  }

  // Inicialización
  renderProducts();
</script>

</body>
</html>
